<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Samaruddin Ahmed — evidence-first AI systems</title>
  <desc id="desc">Mobile dark navy banner with blue orbital line art and the name Mohammed Samaruddin Ahmed.</desc>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070F"/>
      <stop offset="0.55" stop-color="#071224"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <linearGradient id="accentm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="fadeLinem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#1D4ED8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridm" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
    <filter id="softGlowm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="440" rx="24" fill="url(#bgm)"/>
  <rect width="720" height="440" rx="24" fill="url(#gridm)" opacity="0.45"/>
  <circle cx="588" cy="352" r="260" fill="url(#glowm)"/>

  <g fill="none" stroke-linecap="round" opacity="0.85">
    <ellipse cx="588" cy="356" rx="186" ry="80" transform="rotate(-16 588 356)" stroke="#1E40AF" stroke-width="1.2" stroke-opacity="0.55"/>
    <ellipse cx="588" cy="356" rx="140" ry="58" transform="rotate(22 588 356)" stroke="#2563EB" stroke-width="1" stroke-opacity="0.35"/>
    <ellipse cx="588" cy="356" rx="186" ry="80" transform="rotate(-16 588 356)" stroke="url(#accentm)" stroke-width="2" stroke-dasharray="150 380" stroke-dashoffset="30" filter="url(#softGlowm)"/>
    <circle cx="588" cy="356" r="62" stroke="#1D4ED8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 7"/>
  </g>
  <circle cx="454" cy="306" r="4" fill="#38BDF8" filter="url(#softGlowm)"/>
  <circle cx="690" cy="392" r="3" fill="#60A5FA"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="48" y="52" width="272" height="30" rx="15" fill="#0A1930" stroke="#1D4ED8" stroke-opacity="0.7"/>
    <circle cx="66" cy="67" r="3" fill="#38BDF8"/>
    <text x="80" y="71" font-size="10" font-weight="600" letter-spacing="2.8" fill="#7DD3FC">EVIDENCE-FIRST AI SYSTEMS</text>

    <text x="46" y="146" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#F8FAFC">Mohammed</text>
    <text x="46" y="201" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#F8FAFC">Samaruddin Ahmed</text>

    <text x="48" y="249" font-size="19" font-weight="600" fill="#60A5FA">@MrSamarAhmed</text>

    <rect x="48" y="284" width="96" height="2" rx="1" fill="url(#fadeLinem)"/>
    <text x="48" y="316" font-size="14.5" fill="#7C8CA6">Systems that show their work.</text>
  </g>

  <rect x="0.75" y="0.75" width="718.5" height="438.5" rx="23.5" fill="none" stroke="#1E3A8A" stroke-opacity="0.45"/>
</svg>
