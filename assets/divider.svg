<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#1D4ED8" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#1D4ED8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <filter id="dotGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)"/>
  <circle cx="600" cy="12" r="4" fill="#3B82F6" filter="url(#dotGlow)"/>
  <circle cx="600" cy="12" r="1.6" fill="#DBEAFE"/>
</svg>
